# Catppuccin is bundled with Ghostty; no theme downloads needed.
theme = Catppuccin Mocha
font-family = Fira Mono
font-size = 13
window-padding-x = 12
window-padding-y = 10
background-opacity = 1

# macbook-setup: drop-down terminal (Control + Space)
keybind = global:ctrl+space=toggle_quick_terminal
quick-terminal-position = center
quick-terminal-animation-duration = 0
quick-terminal-size = 650px,400px
quick-terminal-autohide = true

# macbook-setup: launch quietly for quick-terminal use
initial-window = false
window-save-state = never
quit-after-last-window-closed = false
