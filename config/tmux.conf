# Lean tmux for Ghostty. Prefix stays Ctrl+B; no plugins.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:clipboard'
set -g escape-time 10
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi

# Splits and new windows inherit the active pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
# Standard prefix + ? shows all bindings; prefix + d detaches.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left '#[fg=#a6e3a1,bold] #S #[default]'
set -g status-left-length 20
set -g status-right '#[fg=#a6adc8]C-b ? help | %H:%M '
set -g status-right-length 28
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
